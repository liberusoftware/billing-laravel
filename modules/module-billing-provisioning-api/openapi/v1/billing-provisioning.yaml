openapi: 3.1.0
info: {title: Billing Provisioning API, version: 1.0.0, description: 'Team-scoped service state, provider operations, rollback, polling, and reconciliation.'}
servers: [{url: /}]
paths:
  /api/v1/billing/provisioning:
    get:
      operationId: billing.provisioning.services.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: billing.provisioning.services.create
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/provisioning/operations:
    get:
      operationId: billing.provisioning.operations.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/billing/provisioning/{provisionedService}:
    get:
      operationId: billing.provisioning.services.show
      security: [{sanctum: []}]
      parameters: [{name: provisionedService, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {description: Resource not found.}}
  /api/v1/billing/provisioning/{provisionedService}/operations:
    post:
      operationId: billing.provisioning.operations.queue
      security: [{sanctum: []}]
      parameters: [{name: provisionedService, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Document'}, '409': {description: Operation already in progress}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/provisioning/{provisionedService}/reconcile:
    post:
      operationId: billing.provisioning.services.reconcile
      security: [{sanctum: []}]
      parameters: [{name: provisionedService, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  parameters:
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
  responses:
    Collection: {description: Paginated team-scoped collection, content: {application/json: {schema: {type: object, required: [data, meta], properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
    Document: {description: Queued provisioning operation, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: object}}}}}}
    Unauthorized: {description: Authentication or scope is required.}
    ValidationError: {description: RFC 9457-compatible validation problem.}
  schemas: {OperationRequest: {type: object, required: [operation], properties: {operation: {type: string}, payload: {type: object, additionalProperties: true}}}, ServiceRequest: {type: object, required: [provider], properties: {customer_id: {type: integer, minimum: 1}, subscription_id: {type: integer, minimum: 1}, provider: {type: string, maxLength: 100}, external_id: {type: string, maxLength: 255}, metadata: {type: object, additionalProperties: true}}}}
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
