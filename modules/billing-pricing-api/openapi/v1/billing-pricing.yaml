openapi: 3.1.0
info:
  title: Billing Pricing API
  version: 1.0.0
  description: Team-scoped pricing plans, contracts, discounts, snapshots, and proration.
servers: [{url: /}]
paths:
  /api/v1/billing/pricing:
    get:
      operationId: billing.pricing.list
      summary: List pricing plans
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      operationId: billing.pricing.create
      summary: Create a pricing plan
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/pricing/contracts:
    get:
      operationId: billing.pricing.contracts.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/billing/pricing/discounts:
    get:
      operationId: billing.pricing.discounts.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/billing/pricing/discounts/{discount}/redeem:
    post:
      operationId: billing.pricing.discounts.redeem
      security: [{sanctum: []}]
      parameters: [{name: discount, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/billing/pricing/snapshots:
    get:
      operationId: billing.pricing.snapshots.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/v1/billing/pricing/plans/{plan}/snapshot:
    post:
      operationId: billing.pricing.snapshots.create
      security: [{sanctum: []}]
      parameters: [{name: plan, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'201': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /api/v1/billing/pricing/proration:
    post:
      operationId: billing.pricing.proration.calculate
      security: [{sanctum: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProrationRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  parameters:
    PageSize: {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 255}}
  responses:
    Collection:
      description: Team-scoped paginated pricing resources.
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Resource'}}, meta: {type: object}}}}}
    Document:
      description: Pricing resource document.
      content: {application/json: {schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Resource'}}}}}
    Unauthorized: {description: Authentication is required.}
    Forbidden: {description: The authenticated token lacks the required module ability.}
    ValidationError: {description: RFC 9457-compatible validation failure.}
  schemas:
    Resource:
      type: object
      required: [id, type, attributes]
      properties: {id: {type: string}, type: {type: string}, attributes: {type: object, additionalProperties: true}}
    PlanRequest:
      type: object
      required: [name, pricing_model, currency, unit_amount_minor]
      properties: {name: {type: string, maxLength: 255}, pricing_model: {type: string, enum: [recurring, one_time, usage, tiered]}, currency: {type: string, pattern: '^[A-Za-z]{3}$'}, unit_amount_minor: {type: integer, minimum: 0}, billing_interval: {type: string}, usage_unit: {type: string}, tiers: {type: array}, metadata: {type: object, additionalProperties: true}}
    ProrationRequest:
      type: object
      required: [amount_minor, remaining_days, period_days]
      properties: {amount_minor: {type: integer, minimum: 0}, remaining_days: {type: integer, minimum: 0}, period_days: {type: integer, minimum: 1}}
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
