openapi: 3.1.0
info: {title: Billing ISP API, version: 1.0.0, description: 'Team-scoped access services, coverage, installation, RADIUS, usage, equipment, and network adapters.'}
servers: [{url: /}]
paths:
  /api/v1/billing/isp/{service}/synchronize:
    post:
      operationId: billing.isp.services.synchronize
      security: [{sanctum: []}]
      parameters: [{name: service, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [adapter], properties: {adapter: {type: string}}}}}}
      responses: {'200': {description: Service synchronized}}
  /api/v1/billing/isp/{service}/accounting:
    post:
      operationId: billing.isp.services.accounting
      security: [{sanctum: []}]
      parameters: [{name: service, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [accounting_session_id, started_at], properties: {accounting_session_id: {type: string}, started_at: {type: string, format: date-time}, ended_at: {type: [string, 'null'], format: date-time}, input_bytes: {type: integer, minimum: 0}, output_bytes: {type: integer, minimum: 0}}}}}}
      responses: {'201': {description: Accounting session recorded}}
  /api/v1/billing/isp/{service}/usage/reset:
    post:
      operationId: billing.isp.services.usage.reset
      security: [{sanctum: []}]
      parameters: [{name: service, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: Usage period reset}}
  /api/v1/billing/isp/capabilities/{capability}/lifecycle:
    patch:
      operationId: billing.isp.capabilities.lifecycle
      security: [{sanctum: []}]
      parameters: [{name: capability, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [pending, active, suspended, cancelled, failed]}}}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/isp:
    get:
      operationId: billing.isp.accessServices.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: billing.isp.accessServices.create
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}, status: {type: string}, metadata: {type: object, additionalProperties: true}}}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/isp/{service}/lifecycle:
    patch:
      operationId: billing.isp.accessServices.lifecycle
      security: [{sanctum: []}]
      parameters: [{name: service, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LifecycleRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/isp/{record}:
    get:
      operationId: billing.isp.accessServices.show
      security: [{sanctum: []}]
      parameters: [{name: record, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {description: Resource not found.}}
  /api/v1/billing/isp/capabilities:
    get: {operationId: billing.isp.capabilities.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post:
      operationId: billing.isp.capabilities.create
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CapabilityRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  parameters:
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
  responses:
    Collection: {description: Paginated team-scoped collection, content: {application/json: {schema: {type: object, required: [data, meta], properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
    Document: {description: ISP resource, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: object}}}}}}
    Unauthorized: {description: Authentication or scope is required.}
    ValidationError: {description: RFC 9457-compatible validation problem.}
  schemas:
    CapabilityRequest: {type: object, required: [capability], properties: {capability: {type: string}, provider: {type: string}, configuration: {type: object, additionalProperties: true}}}
    LifecycleRequest: {type: object, required: [status], properties: {status: {type: string, enum: [pending, active, suspended, cancelled, failed]}}}
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
