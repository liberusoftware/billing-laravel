openapi: 3.1.0
info: {title: Billing Hosting API, version: 1.0.0, description: 'Team-scoped hosting accounts, plans, adapters, SSL, resources, and lifecycle operations.'}
servers: [{url: /}]
paths:
  /api/v1/billing/hosting:
    get:
      operationId: billing.hosting.accounts.list
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Collection'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: billing.hosting.accounts.create
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}, status: {type: string}, metadata: {type: object, additionalProperties: true}}}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/hosting/{account}/lifecycle:
    patch:
      operationId: billing.hosting.accounts.transition
      security: [{sanctum: []}]
      parameters: [{name: account, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [pending, active, suspended, cancelled, failed]}}}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/hosting/{account}/operation:
    post:
      operationId: billing.hosting.accounts.operation
      security: [{sanctum: []}]
      parameters: [{name: account, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [operation], properties: {operation: {type: string, enum: [provision, suspend, unsuspend, change_package, terminate, add_addon, remove_addon]}, account: {type: object}, server: {type: object}}}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/hosting/{record}:
    get:
      operationId: billing.hosting.accounts.show
      security: [{sanctum: []}]
      parameters: [{name: record, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/Document'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {description: Resource not found.}}
  /api/v1/billing/hosting/capabilities:
    get: {operationId: billing.hosting.capabilities.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post:
      operationId: billing.hosting.capabilities.create
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CapabilityRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Document'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/hosting/capabilities/{capability}/lifecycle:
    patch:
      operationId: billing.hosting.capabilities.transition
      security: [{sanctum: []}]
      parameters: [{name: capability, in: path, required: true, schema: {type: integer, minimum: 1}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [pending, active, suspended, cancelled, failed]}}}}}}
      responses: {'200': {$ref: '#/components/responses/Document'}, '409': {description: Invalid lifecycle transition}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  parameters:
    PageSize: {name: page[size], in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 255}}
  responses:
    Collection: {description: Paginated team-scoped collection, content: {application/json: {schema: {type: object, required: [data, meta], properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
    Document: {description: Hosting resource, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: object}}}}}}
    Unauthorized: {description: Authentication or scope is required.}
    ValidationError: {description: RFC 9457-compatible validation problem.}
  schemas: {CapabilityRequest: {type: object, required: [capability], properties: {capability: {type: string}, provider: {type: string}, configuration: {type: object, additionalProperties: true}}}}
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
