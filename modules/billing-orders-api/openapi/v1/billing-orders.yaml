openapi: 3.1.0
info:
  title: Billing Orders API
  version: 1.0.0
  description: Versioned, team-scoped order collection and checkout contract.
  license: {name: MIT, identifier: MIT}
servers:
  - url: /
paths:
  /api/v1/billing/orders:
    get:
      operationId: billing.orders.list
      summary: List authorized orders
      security: [{sanctum: []}]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200': {$ref: '#/components/responses/OrderCollection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: billing.orders.create
      summary: Create an order during checkout
      security: [{sanctum: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Created order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDocument'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/billing/orders/quotes:
    post:
      operationId: billing.orders.quotes.create
      summary: Create a quote
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [currency, items, total_minor], additionalProperties: true}}}}
      responses: {'201': {$ref: '#/components/responses/OrderDocument'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/orders/carts:
    post:
      operationId: billing.orders.carts.create
      summary: Create an open cart
      security: [{sanctum: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [currency, items], additionalProperties: true}}}}
      responses: {'201': {$ref: '#/components/responses/OrderDocument'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/orders/carts/{cart}/checkout:
    post:
      operationId: billing.orders.carts.checkout
      summary: Check out an open cart
      security: [{sanctum: []}]
      parameters: [{name: cart, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses: {'201': {$ref: '#/components/responses/OrderDocument'}, '401': {$ref: '#/components/responses/Unauthorized'}, '409': {description: Cart is already checked out or expired}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/orders/{order}/fraud-review:
    post:
      operationId: billing.orders.fraudReview
      summary: Record a fraud-review decision
      security: [{sanctum: []}]
      parameters: [{name: order, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string}}}}}}
      responses: {'200': {$ref: '#/components/responses/OrderDocument'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/v1/billing/orders/{order}/change-orders:
    post:
      operationId: billing.orders.changeOrders.create
      summary: Add a change order
      security: [{sanctum: []}]
      parameters: [{name: order, in: path, required: true, schema: {type: integer}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], additionalProperties: true}}}}
      responses: {'200': {$ref: '#/components/responses/OrderDocument'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
components:
  parameters:
    PageSize:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 255}
  responses:
    OrderCollection:
      description: Team-scoped paginated orders.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/OrderResource'}}
              meta: {$ref: '#/components/schemas/PaginationMeta'}
    Unauthorized:
      description: Authentication is required.
    Forbidden:
      description: The authenticated token lacks the required ability.
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
  schemas:
    OrderDocument:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/OrderResource'}
    OrderResource:
      type: object
      required: [id, type, attributes]
      properties:
        id: {type: string, description: Opaque order identifier.}
        type: {type: string, const: billing-orders}
        attributes: {$ref: '#/components/schemas/OrderAttributes'}
    OrderAttributes:
      type: object
      required: [order_number, currency, subtotal_minor, discount_minor, tax_minor, total_minor, status, fraud_status]
      properties:
        order_number: {type: string, readOnly: true}
        currency: {type: string, minLength: 3, maxLength: 3, pattern: '^[A-Z]{3}$'}
        subtotal_minor: {type: integer, minimum: 0}
        discount_minor: {type: integer, minimum: 0}
        tax_minor: {type: integer, minimum: 0}
        total_minor: {type: integer, minimum: 0, readOnly: true}
        status: {type: string, enum: [draft, pending_review, approved, rejected, cancelled, completed]}
        fraud_status: {type: string, enum: [not_required, pending, cleared, blocked]}
        agreement: {anyOf: [{type: object, additionalProperties: true}, {type: 'null'}]}
        change_orders: {type: array, items: {type: object, additionalProperties: true}}
    CreateOrderRequest:
      type: object
      required: [currency, subtotal_minor]
      properties:
        currency: {type: string, minLength: 3, maxLength: 3, pattern: '^[A-Za-z]{3}$'}
        subtotal_minor: {type: integer, minimum: 0}
        discount_minor: {type: integer, minimum: 0, default: 0}
        tax_minor: {type: integer, minimum: 0, default: 0}
        customer_id: {anyOf: [{type: integer, minimum: 1}, {type: 'null'}]}
        quote_id: {anyOf: [{type: integer, minimum: 1}, {type: 'null'}]}
        fraud_review_required: {type: boolean, default: false}
        agreement: {anyOf: [{type: object, additionalProperties: true}, {type: 'null'}]}
        metadata: {type: object, additionalProperties: true}
    PaginationMeta:
      type: object
      required: [current_page, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        last_page: {type: integer, minimum: 1}
    ProblemDetails:
      type: object
      properties:
        message: {type: string}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
