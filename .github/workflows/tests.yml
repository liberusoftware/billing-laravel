name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Liberu's installer places published package artifacts in the tracked module
      # directories. The application intentionally retains newer local package logic,
      # so the checked-out repository sources are authoritative for this test run.
      - name: Restore repository-owned package sources
        run: |
          git restore --source=HEAD -- modules themes
          composer dump-autoload --no-interaction --optimize

      - name: Audit dependencies
        run: composer audit --locked

      - name: Check formatting
        run: vendor/bin/pint --test

      # phpstan.neon existed and was configured at level 9 while nothing ever
      # ran it. Scope and level are explained in that file.
      - name: Static analysis
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Generate application key
        run: php artisan key:generate

      # The threshold measures app/ alone — the host's five composition classes. Package
      # coverage is each package's own gate, against its own phpunit.xml (§3.10).
      - name: Run tests
        run: XDEBUG_MODE=coverage php -d memory_limit=1G vendor/bin/pest --coverage-clover=coverage.xml --min=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
